<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ 高速网络扫描器</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 28px; margin-bottom: 8px; }
        .header p { opacity: 0.9; font-size: 14px; }
        .content {
            padding: 30px;
        }
        .alert {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            line-height: 1.5;
        }
        .alert.info {
            background: #d1ecf1;
            border-color: #17a2b8;
            color: #0c5460;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }
        input, button, select {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .progress {
            margin-bottom: 20px;
            display: none;
        }
        .progress.active {
            display: block;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.2s;
        }
        .status {
            font-size: 13px;
            color: #666;
            display: flex;
            justify-content: space-between;
        }
        .results {
            margin-top: 20px;
            height: 400px;
            overflow-y: auto;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fafafa;
        }
        .result-item {
            padding: 12px 15px;
            border-bottom: 1px solid #e5e7eb;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            background: white;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .result-item:hover { background: #f0f4ff; }
        .result-url {
            color: #667eea;
            font-weight: 600;
        }
        .result-btn {
            padding: 4px 12px;
            font-size: 11px;
            background: white;
            color: #667eea;
            border: 1px solid #667eea;
            cursor: pointer;
            border-radius: 3px;
            margin-left: 10px;
        }
        .result-btn:hover {
            background: #667eea;
            color: white;
        }
        .empty-state {
            padding: 40px 20px;
            text-align: center;
            color: #999;
        }
        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .mode-selector {
            background: #f5f7fa;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .mode-selector label {
            margin-right: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        .mode-selector input[type="radio"] {
            margin-right: 5px;
            cursor: pointer;
        }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
            font-size: 14px;
            font-weight: 600;
            animation: slideUp 0.3s ease-out;
            z-index: 9999;
        }
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        .toast.hide {
            animation: slideDown 0.3s ease-out forwards;
        }
        @keyframes slideDown {
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ 高速网络扫描器</h1>
            <p>快速发现局域网内的开放端口</p>
        </div>
        <div class="content">
            <div class="mode-selector">
                <strong>🔧 扫描模式:</strong>
                <label>
                    <input type="radio" name="mode" value="local" checked onchange="updateMode()">
                    浏览器扫描 (本地，无需后端)
                </label>
                <label>
                    <input type="radio" name="mode" value="server" onchange="updateMode()">
                    服务器扫描 (需要本地运行 Node.js)
                </label>
            </div>

            <div id="serverAlert" class="alert info" style="display:none;">
                ℹ️ 已连接到本地扫描服务器 (http://localhost:3334)
            </div>

            <div id="localAlert" class="alert">
                ⚠️ <strong>浏览器扫描</strong>：直接在你的浏览器中扫描，速度较慢（1-5 分钟）。<br>
                想要快速扫描？请安装 Node.js，然后运行：<code style="background:#f0f0f0;padding:2px 6px;">npm install && npm start</code>
            </div>

            <div class="controls">
                <input type="text" id="ipInput" placeholder="IP 范围 (如 192.168.1.*)" value="192.168.1.*">
                <input type="text" id="portsInput" placeholder="端口 (如 43127)" value="43127">
                <button id="scanBtn" onclick="startScan()">开始扫描</button>
                <button id="stopBtn" onclick="stopScan()" disabled>停止</button>
                <button style="background: #f59e0b;" onclick="clearHistory()">清除历史</button>
            </div>

            <div class="progress" id="progressSection">
                <div style="background: #f5f7fa; padding: 20px; border-radius: 8px; margin-bottom: 15px;">
                    <div style="font-size: 14px; margin-bottom: 10px; color: #333;">
                        <strong>当前扫描:</strong> <span id="currentIP" style="color: #667eea; font-weight: 600;">-</span>
                    </div>
                    <div class="progress-bar" style="height: 12px;">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="status" style="margin-top: 10px; font-size: 13px;">
                        <div>
                            <span><span class="spinner"></span>扫描进度</span><br>
                            <span id="progressNum" style="color: #667eea; font-weight: 600; font-size: 16px; margin-top: 5px; display: inline-block;">0/254</span>
                        </div>
                        <div style="text-align: right;">
                            <div style="color: #0ea5e9; font-weight: 600; font-size: 16px;">已发现: <span id="foundCount">0</span></div>
                            <div style="color: #999; font-size: 12px; margin-top: 5px;">预计时间: <span id="estimatedTime">-</span></div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="results" id="results">
                <div class="empty-state">点击"开始扫描"发现局域网服务</div>
            </div>
        </div>
    </div>

    <script>
        let scanning = false;
        let ws = null;
        let currentMode = 'local';

        function updateMode() {
            currentMode = document.querySelector('input[name="mode"]:checked').value;
            document.getElementById('serverAlert').style.display = currentMode === 'server' ? 'block' : 'none';
            document.getElementById('localAlert').style.display = currentMode === 'local' ? 'block' : 'none';

            if (currentMode === 'server' && !ws) {
                connectWs();
            }
        }

        function connectWs() {
            ws = new WebSocket('ws://localhost:3334');
            ws.onopen = () => console.log('✓ 已连接到服务器');
            ws.onmessage = (e) => handleServerMessage(JSON.parse(e.data));
            ws.onerror = () => console.log('✗ 服务器连接失败');
        }

        function handleServerMessage(msg) {
            if (msg.type === 'progress') {
                document.getElementById('progressFill').style.width = msg.percent + '%';
                document.getElementById('progressNum').textContent = msg.current + '/' + msg.total;
            }
            if (msg.type === 'found') {
                addResult(msg.ip, msg.port);
            }
            if (msg.type === 'done') {
                finishScan(msg.count);
            }
        }

        function addResult(ip, port, isOpen) {
            const resultsDiv = document.getElementById('results');
            if (resultsDiv.firstChild?.classList?.contains('empty-state')) {
                resultsDiv.innerHTML = '';
            }

            const item = document.createElement('div');
            item.className = 'result-item';

            if (isOpen) {
                item.innerHTML = `
                    <span class="result-url">✅ http://${ip}:${port}</span>
                    <div>
                        <button class="result-btn" onclick="window.open('http://${ip}:${port}')">访问</button>
                        <button class="result-btn" onclick="copyUrl('http://${ip}:${port}')">复制</button>
                    </div>
                `;
                item.style.background = '#f0f9ff';
                item.style.borderLeft = '3px solid #0ea5e9';
            } else {
                item.innerHTML = `
                    <span class="result-url">❌ ${ip}:${port}</span>
                    <span style="color:#999; font-size:12px;">无响应</span>
                `;
                item.style.background = '#fafafa';
                item.style.color = '#999';
            }

            // 追加到底部
            resultsDiv.appendChild(item);

            // 自动滚动到最新结果
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        function copyUrl(url) {
            navigator.clipboard.writeText(url).then(() => alert('已复制'));
        }

        function parseIps(input) {
            if (input.includes('*')) {
                const prefix = input.replace('.*', '');
                const ips = [];
                for (let i = 1; i <= 254; i++) {
                    ips.push(`${prefix}.${i}`);
                }
                return ips;
            }
            return [input];
        }

        function parsePorts(input) {
            if (input === 'all') {
                return Array.from({length: 65535}, (_, i) => i + 1);
            }
            if (input.includes('-')) {
                const [start, end] = input.split('-').map(Number);
                return Array.from({length: end - start + 1}, (_, i) => start + i);
            }
            return [Number(input)];
        }

        async function testPort(ip, port) {
            // 用 Promise.race 确保一定会超时
            return Promise.race([
                fetch(`http://${ip}:${port}/`, {
                    mode: 'no-cors'
                }).then(() => true).catch(() => false),
                new Promise(resolve => setTimeout(() => resolve(false), 200))
            ]);
        }

        async function startScan() {
            const ip = document.getElementById('ipInput').value.trim();
            const ports = document.getElementById('portsInput').value.trim();

            if (!ip || !ports) {
                alert('请输入 IP 和端口');
                return;
            }

            scanning = true;
            document.getElementById('scanBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('progressSection').classList.add('active');
            document.getElementById('results').innerHTML = '';

            if (currentMode === 'server') {
                if (!ws || ws.readyState !== WebSocket.OPEN) {
                    alert('服务器未连接，请检查是否运行了 npm start');
                    scanning = false;
                    document.getElementById('scanBtn').disabled = false;
                    document.getElementById('stopBtn').disabled = true;
                    document.getElementById('progressSection').classList.remove('active');
                    return;
                }
                ws.send(JSON.stringify({ cmd: 'scan', ip, ports }));
            } else {
                await browserScan(ip, ports);
            }
        }

        async function browserScan(ipInput, portsInput) {
            const ips = parseIps(ipInput);
            const ports = parsePorts(portsInput);
            const total = ips.length * ports.length;
            let current = 0;
            let found = 0;
            const startTime = Date.now();

            // 并行扫描：10 个一批
            const batchSize = 10;
            const tasks = [];

            for (const ip of ips) {
                for (const port of ports) {
                    tasks.push({ ip, port });
                }
            }

            for (let i = 0; i < tasks.length; i += batchSize) {
                if (!scanning) break;

                const batch = tasks.slice(i, i + batchSize);
                const promises = batch.map(async (task) => {
                    const isOpen = await testPort(task.ip, task.port);
                    current++;

                    const percent = Math.round((current * 100) / total);
                    document.getElementById('progressFill').style.width = percent + '%';
                    document.getElementById('progressNum').textContent = current + '/' + total;
                    document.getElementById('currentIP').textContent = task.ip;

                    // 计算预计时间
                    const elapsed = (Date.now() - startTime) / 1000;
                    if (elapsed > 0) {
                        const speed = current / elapsed;
                        const remaining = (total - current) / speed;
                        const remainingText = remaining > 60 ? Math.round(remaining / 60) + ' 分' : Math.round(remaining) + ' 秒';
                        document.getElementById('estimatedTime').textContent = remainingText;
                    }

                    if (isOpen) {
                        addResult(task.ip, task.port, true);
                        found++;
                        document.getElementById('foundCount').textContent = found;
                    }
                });

                await Promise.all(promises);
            }

            // 扫描完成后保存结果
            const resultsDiv = document.getElementById('results');
            const resultItems = resultsDiv.querySelectorAll('.result-item');
            const results = [];
            resultItems.forEach(item => {
                const url = item.querySelector('.result-url').textContent;
                const match = url.match(/(\d+\.\d+\.\d+\.\d+):(\d+)/);
                if (match) {
                    results.push({ ip: match[1], port: match[2] });
                }
            });
            saveResults(results);

            finishScan(found);
        }

        function showToast(message, duration = 3000) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        function finishScan(count) {
            scanning = false;
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('progressSection').classList.remove('active');
            showToast(`✅ 扫描完成! 找到 ${count} 个服务`, 3000);
        }

        function stopScan() {
            scanning = false;
            if (ws && currentMode === 'server') {
                ws.send(JSON.stringify({ cmd: 'stop' }));
            }
            document.getElementById('scanBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('progressSection').classList.remove('active');
        }

        // 保存结果到 localStorage
        function saveResults(results) {
            localStorage.setItem('scanResults', JSON.stringify({
                timestamp: new Date().toLocaleString(),
                results: results
            }));
        }

        // 从 localStorage 加载结果
        function loadResults() {
            const data = localStorage.getItem('scanResults');
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    return parsed;
                } catch (e) {
                    return null;
                }
            }
            return null;
        }

        // 清除历史记录
        function clearHistory() {
            if (confirm('确定要清除所有历史记录吗？')) {
                localStorage.removeItem('scanResults');
                document.getElementById('results').innerHTML = '<div class="empty-state">点击"开始扫描"发现局域网服务</div>';
            }
        }

        // 页面加载时显示历史结果
        window.onload = () => {
            updateMode();

            const cached = loadResults();
            if (cached && cached.results && cached.results.length > 0) {
                const resultsDiv = document.getElementById('results');
                resultsDiv.innerHTML = '';

                // 显示最后扫描时间
                const header = document.createElement('div');
                header.style.cssText = 'padding: 12px 15px; background: #f0f4ff; border-bottom: 1px solid #e5e7eb; color: #667eea; font-size: 12px;';
                header.textContent = '📋 上次扫描结果：' + cached.timestamp;
                resultsDiv.appendChild(header);

                // 显示缓存的结果
                cached.results.forEach(result => {
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    item.innerHTML = `
                        <span class="result-url">✅ http://${result.ip}:${result.port}</span>
                        <div>
                            <button class="result-btn" onclick="window.open('http://${result.ip}:${result.port}')">访问</button>
                            <button class="result-btn" onclick="copyUrl('http://${result.ip}:${result.port}')">复制</button>
                        </div>
                    `;
                    item.style.background = '#f0f9ff';
                    item.style.borderLeft = '3px solid #0ea5e9';
                    resultsDiv.appendChild(item);
                });
            }
        };
    </script>
</body>
</html>
